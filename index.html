<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Memories - For Mirriam</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--pink:#ffd6e0;--lav:#e9d5ff;--ink:#4a2c5a;--card:#fff8fb}
body{margin:0;font-family:Inter,sans-serif;background:linear-gradient(180deg,#fdf2f8,#f5f0ff);color:var(--ink)}
header{padding:18px 20px;display:flex;justify-content:space-between;align-items:center;background:#ffffffaa;backdrop-filter:blur(10px);position:sticky;top:0}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600}
.btn{background:#ffb3c6;border:0;padding:10px 18px;border-radius:999px;font-weight:600;cursor:pointer}
.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 10px 30px #0000000d;margin-bottom:14px}
.grid{max-width:900px;margin:0 auto;padding:20px}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #e9d5ff;margin:6px 0;box-sizing:border-box}
.timeline{border-left:3px solid #e9d5ff;padding-left:18px}
.dot{width:12px;height:12px;background:#ffb3c6;border-radius:50%;margin-left:-25px;display:inline-block}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.gallery img{width:100%;height:140px;object-fit:cover;border-radius:12px}
</style>
</head>
<body>
<header>
<div class="logo">💜 Our Memories</div>
<div><button class="btn" onclick="document.getElementById('addBox').scrollIntoView({behavior:'smooth'})">+ Add Memory</button></div>
</header>

<div class="grid">
<div class="card" style="text-align:center;background:linear-gradient(90deg,#ffe4ec,#e9d5ff)">
<h1 style="font-family:'Cormorant Garamond';margin:6px 0">Mirriam & You</h1>
<p>Together — Every moment saved, synced for both of you</p>
<div id="stats">Loading memories...</div>
</div>

<div class="card" id="addBox">
<h3>Add a Memory / Photo</h3>
<input type="date" id="mDate">
<input type="text" id="mTitle" placeholder="Title - e.g. First Date at Athi River">
<textarea id="mDesc" placeholder="What happened..."></textarea>
<input type="file" id="mPhoto" accept="image/*">
<button class="btn" onclick="addMemory()">Save to Supabase 💾</button>
<p id="status" style="font-size:12px"></p>
</div>

<h2>Our Love Timeline</h2>
<div id="timeline" class="timeline">Loading...</div>

<h2>Photos</h2>
<div id="gallery" class="gallery">Loading...</div>

<h2>Letters / Stories</h2>
<div class="card">
<input type="text" id="sTitle" placeholder="Letter title">
<textarea id="sBody" placeholder="Write a letter to her..."></textarea>
<input type="text" id="sDate" placeholder="Date e.g. Oct 28, 2026">
<button class="btn" onclick="addStory()">Save Letter</button>
</div>
<div id="stories"></div>
</div>

<script>
const SUPABASE_URL = "https://rmocadjpfqrjdomonpym.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtb2NhZGpwZnFyamRvbW9ucHltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxODU3MTIsImV4cCI6MjEwODc2MTcxMn0.aD_c-iXdzbk0vllIGQ2v6ip_OCcbTvH_lJ9ZOwK8SF0";

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function loadAll(){
  let {data: mems} = await supabaseClient.from('memories').select('*').order('date',{ascending:true});
  let tl = document.getElementById('timeline');
  let gal = document.getElementById('gallery');
  let stats = document.getElementById('stats');
  if(!mems) mems=[];
  stats.innerText = mems.length + " Memories saved • Synced with Supabase";
  tl.innerHTML = mems.map(m=>`<div class="card"><span class="dot"></span><small>${m.date||''}</small><h3 style="margin:4px 0">${m.title||''}</h3><p>${m.description||''}</p></div>`).join('') || "<p>No memories yet</p>";

  let {data: photos} = await supabaseClient.storage.from('photos').list();
  if(photos && photos.length){
    let urls = await Promise.all(photos.map(async p=>{
      let {data} = await supabaseClient.storage.from('photos').getPublicUrl(p.name);
      return `<img src="${data.publicUrl}">`;
    }));
    gal.innerHTML = urls.join('');
  } else {
    gal.innerHTML = "<p>No photos yet</p>";
  }

  let {data: stories} = await supabaseClient.from('stories').select('*').order('created_at',{ascending:false});
  let sDiv = document.getElementById('stories');
  sDiv.innerHTML = (stories||[]).map(s=>`<div class="card"><small>${s.date||''}</small><h3>${s.title}</h3><p>${s.body}</p></div>`).join('');
}

async function addMemory(){
  const date = document.getElementById('mDate').value;
  const title = document.getElementById('mTitle').value;
  const desc = document.getElementById('mDesc').value;
  const file = document.getElementById('mPhoto').files[0];
  const status = document.getElementById('status');
  if(!title){status.innerText="Add title";return;}
  status.innerText="Saving...";
  try{
    if(file){
      let fileName = Date.now()+"_"+file.name;
      let {error: upErr} = await supabaseClient.storage.from('photos').upload(fileName, file);
      if(upErr) throw upErr;
    }
    let {error} = await supabaseClient.from('memories').insert([{date, title, description: desc}]);
    if(error) throw error;
    status.innerText="Saved! 💜";
    document.getElementById('mTitle').value="";document.getElementById('mDesc').value="";
    loadAll();
  }catch(e){status.innerText="Error: "+e.message;}
}

async function addStory(){
  const title = document.getElementById('sTitle').value;
  const body = document.getElementById('sBody').value;
  const date = document.getElementById('sDate').value;
  if(!title||!body) return alert("Add title and body");
  let {error} = await supabaseClient.from('stories').insert([{title, body, date}]);
  if(error) alert(error.message); else {alert("Letter saved!");loadAll();}
}
loadAll();
</script>
</body>
</html>
